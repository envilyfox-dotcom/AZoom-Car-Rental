<!DOCTYPE html>
<html lang="en">

</head>
<body>

  <header>

    <nav>

  <main>
    <h1>Login</h1>
    <form id="loginForm">
      <label for="username">Username</label>
      <input type="text" id="username" required>

      <input type="password" id="password" required>

      <br><br>
      <button type="submit" class="btn">Login</button>
    </form>
  </main>

  <footer>

  </footer>

  <dialog id="msgDialog">
    <p id="msgText"></p>
    <button id="msgClose" class="btn">OK</button>
  </dialog>

  <script src="js/script.js"></script>
</body>
</html>
